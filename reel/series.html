<!DOCTYPE html>

<head>

<title>Meet Refract Tech — reels</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@300;400;500;600;700&display=block">
<style>
/* "Meet Refract Tech" reels: 1080 × 1920; every frame is set by window.render(t). */
:root { --navy:#11112B; --violet:#713DE8; --purple:#B66CFA; --coral:#FF906B; --white:#F7F5FF; --ink2:#CFCAE8; --ink3:#9A94BF; }
* { box-sizing:border-box; margin:0; padding:0; }
html, body { width:1080px; height:1920px; overflow:hidden; background:var(--navy); }
body { font-family:"Albert Sans",system-ui,sans-serif; color:var(--white); -webkit-font-smoothing:antialiased; }
svg { display:block; }
#sky, #hud { position:absolute; inset:0; }
#hud { perspective:2200px; perspective-origin:540px 1000px; --acc:#B66CFA; }
#vignette { position:absolute; inset:0; background:radial-gradient(120% 85% at 50% 52%, transparent 58%, rgba(6,6,22,.5) 100%); }

/* words */
.lines { position:absolute; left:0; right:0; }
.lrow { overflow:hidden; text-align:center; white-space:nowrap; line-height:1.1; letter-spacing:-.03em; padding:0 .05em .14em; margin-bottom:-.08em; }
.lin { display:inline-block; }
.acc { position:relative; display:inline-block; background:linear-gradient(90deg,var(--acc),#FF906B); -webkit-background-clip:text; background-clip:text; color:transparent; }
.acc::after { content:""; position:absolute; left:.02em; right:.02em; bottom:-.02em; height:.05em; border-radius:.03em; background:linear-gradient(90deg,var(--acc),#FF906B); transform:scaleX(var(--u,0)); transform-origin:left; }
.backdrop { position:absolute; left:540px; top:1010px; font-size:780px; font-weight:700; line-height:1; letter-spacing:-.06em; white-space:nowrap;
  color:transparent; -webkit-text-stroke:3px color-mix(in srgb, var(--acc) 34%, transparent); }
.ep-tag { position:absolute; left:0; right:0; top:236px; display:flex; justify-content:center; align-items:center; gap:14px; font-size:28px; font-weight:500; letter-spacing:.2em; text-transform:uppercase; color:var(--ink2); }
.ep-tag b { width:12px; height:12px; border-radius:50%; background:var(--acc); box-shadow:0 0 14px var(--acc); }
.ep-label { position:absolute; left:0; right:0; top:236px; text-align:center; font-size:30px; font-weight:600; letter-spacing:.26em; text-transform:uppercase; color:var(--acc); }
.offer { position:absolute; left:540px; display:flex; align-items:center; gap:24px; padding:32px 46px; border-radius:32px; font-size:48px; font-weight:500; white-space:nowrap;

  background:linear-gradient(90deg,rgba(113,61,232,.5),rgba(182,108,250,.35) 50%,rgba(255,144,107,.45)); box-shadow:0 0 0 3px rgba(182,108,250,.8), 0 24px 80px -12px rgba(113,61,232,.7); }
.email i { width:52px; display:block; position:relative; } .email span:last-child { position:relative; }
.email-sheen { position:absolute; top:0; bottom:0; left:0; width:40%; background:linear-gradient(100deg,transparent,rgba(255,255,255,.35),transparent); }

.site-pill em { font-style:normal; font-size:30px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; padding:12px 22px; border-radius:30px; background:var(--coral); color:var(--navy); position:relative; }

/* the teaser's logo opening (shared with the main reel) */
.world, .layer { position:absolute; left:0; top:0; width:1080px; height:1920px; transform-style:preserve-3d; }
.world { perspective:2400px; perspective-origin:540px 900px; }
.layer { transform-origin:540px 1040px; }

.hook-shine { position:absolute; overflow:hidden; -webkit-mask-image:url(assets/r-mark.png); mask-image:url(assets/r-mark.png); -webkit-mask-size:100% 100%; mask-size:100% 100%; }
.hook-shine i { position:absolute; top:-40%; bottom:-40%; left:0; width:45%; background:linear-gradient(90deg,transparent,rgba(255,255,255,.85),transparent); }

.hook-word span { display:inline-block; } .hook-word b { color:var(--coral); font-weight:600; }

.logo-ring { position:absolute; left:0; top:0; width:420px; height:420px; }

/* what we build: one offer at a time */
.ocard { position:absolute; left:110px; top:520px; width:860px; height:880px; border-radius:48px; overflow:hidden; padding:44px 56px;
  background:linear-gradient(160deg,rgba(44,37,100,.95),rgba(19,17,48,.97)) padding-box, linear-gradient(135deg,rgba(139,92,240,.95),rgba(182,108,250,.35) 50%,rgba(255,144,107,.9)) border-box;
  border:3px solid transparent; box-shadow:0 70px 140px -50px #000, 0 0 140px -40px rgba(113,61,232,.7); }
.o-top { display:flex; justify-content:space-between; align-items:center; font-size:28px; font-weight:500; letter-spacing:.2em; color:var(--ink3); }
.o-dots { display:flex; gap:10px; } .o-dots i { width:34px; height:8px; border-radius:4px; background:rgba(247,245,255,.16); } .o-dots i.on { background:linear-gradient(90deg,#B66CFA,#FF906B); }

  background:linear-gradient(145deg,rgba(113,61,232,.35),rgba(255,144,107,.18)); box-shadow:inset 0 0 0 2px rgba(247,245,255,.12); }

.note { position:absolute; left:0; top:0; height:96px; transform-style:preserve-3d; }
