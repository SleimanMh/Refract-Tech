<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Meet Refract Tech — reels</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@300;400;500;600;700&display=block">
<style>
/* "Meet Refract Tech" reels: 1080 × 1920; every frame is set by window.render(t). */
:root { --navy:#11112B; --violet:#713DE8; --purple:#B66CFA; --coral:#FF906B; --white:#F7F5FF; --ink2:#CFCAE8; --ink3:#9A94BF; }
* { box-sizing:border-box; margin:0; padding:0; }
html, body { width:1080px; height:1920px; overflow:hidden; background:var(--navy); }
body { font-family:"Albert Sans",system-ui,sans-serif; color:var(--white); -webkit-font-smoothing:antialiased; }
svg { display:block; }
#sky, #hud { position:absolute; inset:0; }
#hud { perspective:2200px; perspective-origin:540px 1000px; --acc:#B66CFA; }
#vignette { position:absolute; inset:0; background:radial-gradient(120% 85% at 50% 52%, transparent 58%, rgba(6,6,22,.5) 100%); }

/* words */
.lines { position:absolute; left:0; right:0; }
.lrow { overflow:hidden; text-align:center; white-space:nowrap; line-height:1.1; letter-spacing:-.03em; padding:0 .05em .14em; margin-bottom:-.08em; }
.lin { display:inline-block; }
.acc { position:relative; display:inline-block; background:linear-gradient(90deg,var(--acc),#FF906B); -webkit-background-clip:text; background-clip:text; color:transparent; }
.acc::after { content:""; position:absolute; left:.02em; right:.02em; bottom:-.02em; height:.05em; border-radius:.03em; background:linear-gradient(90deg,var(--acc),#FF906B); transform:scaleX(var(--u,0)); transform-origin:left; }
.backdrop { position:absolute; left:540px; top:1010px; font-size:780px; font-weight:700; line-height:1; letter-spacing:-.06em; white-space:nowrap;
  color:transparent; -webkit-text-stroke:3px color-mix(in srgb, var(--acc) 34%, transparent); }
.ep-tag { position:absolute; left:0; right:0; top:236px; display:flex; justify-content:center; align-items:center; gap:14px; font-size:28px; font-weight:500; letter-spacing:.2em; text-transform:uppercase; color:var(--ink2); }
.ep-tag b { width:12px; height:12px; border-radius:50%; background:var(--acc); box-shadow:0 0 14px var(--acc); }
.ep-label { position:absolute; left:0; right:0; top:236px; text-align:center; font-size:30px; font-weight:600; letter-spacing:.26em; text-transform:uppercase; color:var(--acc); }
.offer { position:absolute; left:540px; display:flex; align-items:center; gap:24px; padding:32px 46px; border-radius:32px; font-size:48px; font-weight:500; white-space:nowrap;
  background:rgba(30,27,72,.88); box-shadow:inset 0 0 0 2px rgba(182,108,250,.38), 0 30px 70px -30px #000; }
.offer i { width:56px; display:block; color:var(--purple); }

/* the stage card */
.scard { position:absolute; left:180px; top:520px; width:720px; height:1080px; border-radius:42px; overflow:hidden; transform-origin:50% 60%; }
.scard canvas { display:block; width:720px; height:1080px; }
.scard-sheen { position:absolute; top:-30%; bottom:-30%; left:30%; width:40%; background:linear-gradient(100deg,transparent,rgba(255,255,255,.22),transparent); }

/* logo and end card */
.end { position:absolute; inset:0; }
.logo { position:absolute; left:0; top:0; display:grid; place-items:center; }
.logo svg { position:absolute; inset:0; } .logo img { position:relative; }
.email { position:absolute; left:0; top:0; display:flex; align-items:center; gap:20px; padding:30px 39px; border-radius:999px; overflow:hidden; white-space:nowrap; font-size:52px; font-weight:600; letter-spacing:-.5px;
  background:linear-gradient(90deg,rgba(113,61,232,.5),rgba(182,108,250,.35) 50%,rgba(255,144,107,.45)); box-shadow:0 0 0 3px rgba(182,108,250,.8), 0 24px 80px -12px rgba(113,61,232,.7); }
.email i { width:52px; display:block; position:relative; } .email span:last-child { position:relative; }
.email-sheen { position:absolute; top:0; bottom:0; left:0; width:40%; background:linear-gradient(100deg,transparent,rgba(255,255,255,.35),transparent); }
.soon { position:absolute; left:0; top:0; display:flex; align-items:center; gap:14px; font-size:30px; font-weight:500; letter-spacing:.14em; text-transform:uppercase; color:var(--ink2); white-space:nowrap; }
.soon b { width:14px; height:14px; border-radius:50%; background:var(--coral); box-shadow:0 0 14px var(--coral); }
.site-pill { position:absolute; left:0; top:0; display:flex; align-items:center; gap:22px; padding:30px 34px 30px 52px; border-radius:999px; overflow:hidden; font-size:60px; font-weight:600; white-space:nowrap;
  background:rgba(27,24,66,.92); box-shadow:0 0 0 3px rgba(182,108,250,.8), 0 24px 80px -12px rgba(113,61,232,.7); }
.site-pill em { font-style:normal; font-size:30px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; padding:12px 22px; border-radius:30px; background:var(--coral); color:var(--navy); position:relative; }

/* the teaser's logo opening (shared with the main reel) */
.world, .layer { position:absolute; left:0; top:0; width:1080px; height:1920px; transform-style:preserve-3d; }
.world { perspective:2400px; perspective-origin:540px 900px; }
.layer { transform-origin:540px 1040px; }
.spark { position:absolute; left:0; top:0; width:220px; height:220px; border-radius:50%;
  background:radial-gradient(circle, #fff 0, #F3EAFF 12%, rgba(182,108,250,.95) 26%, rgba(113,61,232,.45) 46%, transparent 68%); }
.spark-glow { position:absolute; left:0; top:0; width:1000px; height:1000px; border-radius:50%; background:radial-gradient(closest-side, rgba(182,108,250,.55), rgba(113,61,232,.2) 50%, transparent); }
.flare { position:absolute; left:0; top:0; width:1500px; height:10px; border-radius:50%;
  background:linear-gradient(90deg,transparent,rgba(182,108,250,.6) 30%,#fff 50%,rgba(255,144,107,.6) 70%,transparent); box-shadow:0 0 30px 6px rgba(182,108,250,.45); }
.flare-v { width:8px; height:520px; background:linear-gradient(180deg,transparent,rgba(247,245,255,.85) 50%,transparent); box-shadow:none; }
.hook-logo { position:absolute; left:0; top:0; width:1080px; height:1920px; transform-style:preserve-3d; }
.r-shard { position:absolute; }
.ring-tip { position:absolute; left:0; top:0; width:46px; height:46px; border-radius:50%; background:radial-gradient(circle,#fff 0,#F3EAFF 25%,rgba(255,144,107,.8) 45%,transparent 72%); box-shadow:0 0 40px 10px rgba(182,108,250,.5); }
.hook-shine { position:absolute; overflow:hidden; -webkit-mask-image:url(assets/r-mark.png); mask-image:url(assets/r-mark.png); -webkit-mask-size:100% 100%; mask-size:100% 100%; }
.hook-shine i { position:absolute; top:-40%; bottom:-40%; left:0; width:45%; background:linear-gradient(90deg,transparent,rgba(255,255,255,.85),transparent); }
.hook-word { position:absolute; left:0; right:0; top:1104px; text-align:center; overflow:hidden; padding-bottom:.1em; font-size:116px; font-weight:600; letter-spacing:-3.5px; line-height:1.12; }
.hook-word span { display:inline-block; } .hook-word b { color:var(--coral); font-weight:600; }
.hook-tag { position:absolute; left:0; right:0; top:1276px; display:flex; justify-content:center; align-items:center; gap:26px; font-size:32px; font-weight:400; letter-spacing:.34em; text-transform:uppercase; color:var(--ink2); }
.hook-tag i { display:block; width:90px; height:3px; border-radius:2px; background:var(--violet); }
.logo-glow { position:absolute; left:0; top:0; width:1000px; height:1000px; border-radius:50%; background:radial-gradient(closest-side,rgba(182,108,250,.6),rgba(113,61,232,.25) 55%,transparent); }
.logo-ring { position:absolute; left:0; top:0; width:420px; height:420px; }

/* what we build: one offer at a time */
.ocard { position:absolute; left:110px; top:520px; width:860px; height:880px; border-radius:48px; overflow:hidden; padding:44px 56px;
  background:linear-gradient(160deg,rgba(44,37,100,.95),rgba(19,17,48,.97)) padding-box, linear-gradient(135deg,rgba(139,92,240,.95),rgba(182,108,250,.35) 50%,rgba(255,144,107,.9)) border-box;
  border:3px solid transparent; box-shadow:0 70px 140px -50px #000, 0 0 140px -40px rgba(113,61,232,.7); }
.o-top { display:flex; justify-content:space-between; align-items:center; font-size:28px; font-weight:500; letter-spacing:.2em; color:var(--ink3); }
.o-dots { display:flex; gap:10px; } .o-dots i { width:34px; height:8px; border-radius:4px; background:rgba(247,245,255,.16); } .o-dots i.on { background:linear-gradient(90deg,#B66CFA,#FF906B); }
.o-tile { position:relative; width:380px; height:340px; margin:48px 0 44px; border-radius:56px; display:grid; place-items:center;
  background:linear-gradient(145deg,rgba(113,61,232,.35),rgba(255,144,107,.18)); box-shadow:inset 0 0 0 2px rgba(247,245,255,.12); }
.o-glow { position:absolute; inset:-40px; border-radius:50%; background:radial-gradient(closest-side,rgba(182,108,250,.45),transparent); }
.o-tile svg { position:relative; filter:drop-shadow(0 0 18px rgba(182,108,250,.6)); }
.o-row { overflow:hidden; padding-bottom:.08em; white-space:nowrap; } .o-row span { display:inline-block; font-size:70px; font-weight:600; letter-spacing:-.03em; line-height:1.06; }
.o-title .o-row:last-child span { background:linear-gradient(90deg,#B66CFA,#FF906B); -webkit-background-clip:text; background-clip:text; color:transparent; }
.o-line { margin-top:24px; font-size:34px; line-height:1.3; color:var(--ink2); }
.o-sheen { position:absolute; top:-30%; bottom:-30%; left:30%; width:40%; background:linear-gradient(100deg,transparent,rgba(255,255,255,.14),transparent); }

/* the closing */
.pulse { position:absolute; left:0; top:0; width:300px; height:300px; border-radius:50%; border:3px solid rgba(182,108,250,.8); box-shadow:0 0 30px rgba(182,108,250,.5); }
.email .e-txt { position:relative; min-height:1.2em; }

/* Discover reel: notes that flip into a plan, the plan board, the scan line, the lens */
.note { position:absolute; left:0; top:0; height:96px; transform-style:preserve-3d; }
.note .nf, .note .nb { position:absolute; inset:0; display:flex; align-items:center; gap:20px; padding:0 38px; border-radius:26px; white-space:nowrap; font-size:46px; font-weight:500; backface-visibility:hidden; }
.note .nf { position:relative; width:max-content; background:rgba(40,34,92,.94); box-shadow:inset 0 0 0 2px rgba(182,108,250,.4), 0 24px 50px -24px #000; }
.note .nf b { width:14px; height:14px; border-radius:50%; background:var(--coral); box-shadow:0 0 12px var(--coral); }
.note .nb { transform:rotateX(180deg); background:linear-gradient(90deg,rgba(113,61,232,.55),rgba(46,39,104,.95) 60%); box-shadow:inset 0 0 0 2px rgba(182,108,250,.55), 0 0 calc(var(--g,0) * 50px) rgba(182,108,250,.7); }
.note .nb i { display:grid; place-items:center; width:46px; height:46px; border-radius:50%; background:linear-gradient(135deg,#8B5CF0,#FF906B); flex:none; }
.note .nb i svg { width:28px; color:#fff; }
.plan { position:absolute; left:120px; top:640px; width:840px; height:800px; border-radius:44px;
  background:linear-gradient(160deg,rgba(36,31,84,.7),rgba(17,17,43,.75)); box-shadow:inset 0 0 0 2px rgba(182,108,250,.35), 0 60px 120px -50px #000; }
.plan-h { display:flex; justify-content:space-between; align-items:center; padding:34px 40px 0; font-size:32px; font-weight:600; letter-spacing:.02em; }
.plan-h em { font-style:normal; font-size:24px; letter-spacing:.2em; text-transform:uppercase; color:var(--acc); }
.scan { position:absolute; left:0; right:0; top:0; height:6px; background:linear-gradient(90deg,transparent,#B66CFA 20%,#fff 50%,#FF906B 80%,transparent); box-shadow:0 0 40px 10px rgba(182,108,250,.55); }
.lens { position:absolute; left:0; right:0; height:300px; }
.lens-blur, .lens-sharp { position:absolute; inset:0; text-align:center; }
.lens-blur { filter:blur(16px); opacity:.6; }
.lrow2 { font-size:110px; font-weight:500; letter-spacing:-.03em; line-height:1.15; white-space:nowrap; }
.lens-ring { position:absolute; left:0; top:0; width:330px; height:330px; border-radius:50%; border:4px solid rgba(247,245,255,.85);
  box-shadow:0 0 40px rgba(182,108,250,.8), inset 0 0 40px rgba(182,108,250,.35); }
</style>
</head>
<body>
<canvas id="sky" width="1080" height="1920"></canvas>
<div id="vignette"></div>
<div id="hud"></div>
<script type="module" src="src/series.js"></script>
</body>
</html>
